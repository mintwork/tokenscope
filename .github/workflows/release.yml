name: Release

# Publishing a GitHub Release (tag vX.Y.Z) publishes that version to npm with provenance.
# Auth: npm trusted publishing (OIDC) once configured on npmjs.com, otherwise the NPM_TOKEN secret.
on:
  release:
    types: [published]
  # Manual runs only check npm auth and pack the package; they never publish.
  workflow_dispatch:

permissions:
  contents: write # move the major tag
  id-token: write # npm provenance / trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run typecheck && npm test

      - name: Check the tag matches package.json
        if: github.event_name == 'release'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" != "release" ]; then
            echo "Dry run: npm user is $(npm whoami)"
            npm publish --provenance --access public --dry-run
          elif npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm, skipping publish"
          else
            npm publish --provenance --access public
          fi
