name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Smoke test the CLI against synthetic fixtures
        run: |
          npm run smoke
          node dist/cli.js --dir test/fixtures/claude/projects --codex-dir test/fixtures/codex/sessions --path amp=test/fixtures/amp/threads --json out.json
          node dist/cli.js --dir test/fixtures/claude/projects --codex-dir test/fixtures/codex/sessions --html out.html
          node -e "const r=require('./out.json'); if(!(r.totals.calls>0 && r.coverage.length>=2)) process.exit(1)"
      - name: Package contents
        run: npm pack --dry-run
